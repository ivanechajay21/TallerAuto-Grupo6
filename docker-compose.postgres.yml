services:
  postgres:
    image: postgres:16-alpine
    container_name: sigtm_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - sigtm_postgres_network
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4:8
    container_name: sigtm_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@sigtm.local}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:?PGADMIN_DEFAULT_PASSWORD is required}
    ports:
      - "8082:80"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - sigtm_postgres_network
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sigtm_backend_postgres
    ports:
      - "8080:8080"
    environment:
      TZ: America/Lima
      SPRING_PROFILES_ACTIVE: postgres
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-7200000}
      JWT_ISSUER: ${JWT_ISSUER:-sigtm-backend}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-sigtm-web}
      MFA_REQUIRED_FOR_ADMIN: ${MFA_REQUIRED_FOR_ADMIN:-true}
      MFA_ISSUER: ${MFA_ISSUER:-SIGTM}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      COOKIE_SAME_SITE: ${COOKIE_SAME_SITE:-Strict}
      MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      UPLOAD_DIR: /app/uploads
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      SEED_DATA: ${SEED_DATA:-true}
      USE_APACHE_POI: ${USE_APACHE_POI:-true}
    volumes:
      - uploads_postgres_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - sigtm_postgres_network
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_USE_APACHE_POI: ${USE_APACHE_POI:-true}
    container_name: sigtm_frontend_postgres
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_started
    networks:
      - sigtm_postgres_network
    restart: unless-stopped

volumes:
  postgres_data:
  uploads_postgres_data:

networks:
  sigtm_postgres_network:
    driver: bridge
