services:
  mysql:
    image: mysql:8.0
    container_name: sigtm_mysql_dev
    environment:
      MYSQL_ROOT_PASSWORD: ${ROOT_PASSWORD:?ROOT_PASSWORD is required}
      MYSQL_DATABASE: ${MYSQL_DATABASE:?MYSQL_DATABASE is required}
      MYSQL_USER: ${MYSQL_USER:?MYSQL_USER is required}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
    ports:
      - "3306:3306"
    volumes:
      - mysql_dev_data:/var/lib/mysql
    networks:
      - sigtm_dev_network

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: sigtm_phpmyadmin_dev
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
    ports:
      - "8081:80"
    depends_on:
      - mysql
    networks:
      - sigtm_dev_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: builder
    container_name: sigtm_backend_dev
    entrypoint: []
    command: sh ./mvnw spring-boot:run
    environment:
      TZ: America/Lima
      DB_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
      DB_USERNAME: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      FRONTEND_URL: http://localhost:5173
      UPLOAD_DIR: /app/uploads
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      SEED_DATA: ${SEED_DATA:-true}
      USE_APACHE_POI: ${USE_APACHE_POI:-false}
    ports:
      - "8080:8080"
    volumes:
      - ./backend:/app
      - maven_dev_cache:/root/.m2
      - uploads_dev_data:/app/uploads
    depends_on:
      - mysql
    networks:
      - sigtm_dev_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: builder
    container_name: sigtm_frontend_dev
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"
    environment:
      CHOKIDAR_USEPOLLING: "true"
      VITE_USE_APACHE_POI: ${USE_APACHE_POI:-false}
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_dev_node_modules:/app/node_modules
    depends_on:
      - backend
    networks:
      - sigtm_dev_network

volumes:
  mysql_dev_data:
  uploads_dev_data:
  maven_dev_cache:
  frontend_dev_node_modules:

networks:
  sigtm_dev_network:
    driver: bridge
