version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: sigtm_mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${ROOT_PASSWORD:?ROOT_PASSWORD is required}
      MYSQL_DATABASE: ${MYSQL_DATABASE:?MYSQL_DATABASE is required}
      MYSQL_USER: ${MYSQL_USER:?MYSQL_USER is required}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - sigtm_network
    restart: unless-stopped

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: sigtm_phpmyadmin
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
    ports:
      - "8081:80"
    depends_on:
      - mysql
    networks:
      - sigtm_network
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sigtm_backend
    ports:
      - "8080:8080"
    environment:
      - TZ=America/Lima
      - DB_URL=jdbc:mysql://mysql:3306/${MYSQL_DATABASE}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
      - DB_USERNAME=${MYSQL_USER}
      - DB_PASSWORD=${MYSQL_PASSWORD}
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required}
      - MAIL_HOST=${MAIL_HOST:-smtp.gmail.com}
      - MAIL_PORT=${MAIL_PORT:-587}
      - MAIL_USERNAME=${MAIL_USERNAME:-}
      - MAIL_PASSWORD=${MAIL_PASSWORD:-}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:3000}
      - UPLOAD_DIR=/app/uploads
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      - SEED_DATA=${SEED_DATA:-true}
      - USE_APACHE_POI=${USE_APACHE_POI:-false}
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      - mysql
    networks:
      - sigtm_network
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_USE_APACHE_POI: ${USE_APACHE_POI:-false}
    container_name: sigtm_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - sigtm_network
    restart: unless-stopped

volumes:
  mysql_data:
  uploads_data:

networks:
  sigtm_network:
    driver: bridge
