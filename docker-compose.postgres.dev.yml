services:
  postgres:
    image: postgres:16-alpine
    container_name: sigtm_postgres_dev
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    ports:
      - "5432:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - sigtm_postgres_dev_network

  pgadmin:
    image: dpage/pgadmin4:8
    container_name: sigtm_pgadmin_dev
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@sigtm.local}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:?PGADMIN_DEFAULT_PASSWORD is required}
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "8082:80"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - sigtm_postgres_dev_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: builder
    container_name: sigtm_backend_postgres_dev
    entrypoint: []
    command: sh ./mvnw spring-boot:run
    environment:
      TZ: America/Lima
      SPRING_PROFILES_ACTIVE: postgres
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      FRONTEND_URL: http://localhost:5173
      UPLOAD_DIR: /app/uploads
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      SEED_DATA: ${SEED_DATA:-true}
      USE_APACHE_POI: ${USE_APACHE_POI:-false}
    ports:
      - "8080:8080"
    volumes:
      - ./backend:/app
      - maven_postgres_dev_cache:/root/.m2
      - uploads_postgres_dev_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - sigtm_postgres_dev_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: builder
    container_name: sigtm_frontend_postgres_dev
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"
    environment:
      CHOKIDAR_USEPOLLING: "true"
      VITE_USE_APACHE_POI: ${USE_APACHE_POI:-false}
      VITE_PROXY_TARGET: http://backend:8080
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_postgres_dev_node_modules:/app/node_modules
    depends_on:
      backend:
        condition: service_started
    networks:
      - sigtm_postgres_dev_network

volumes:
  postgres_dev_data:
  uploads_postgres_dev_data:
  maven_postgres_dev_cache:
  frontend_postgres_dev_node_modules:

networks:
  sigtm_postgres_dev_network:
    driver: bridge
